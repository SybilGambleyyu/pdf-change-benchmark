[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pdf-change-benchmark"
version = "1.8.0"
description = "Reproducible paired-PDF fixtures for static change-assurance tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SybilGambleyyu" }]
keywords = ["benchmark", "ci", "diff", "pdf", "privacy", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "pypdf==6.15.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.8",
  "twine>=6.0",
]

[project.scripts]
pdfcab = "pdfcab.cli:main"

[project.urls]
Homepage = "https://github.com/SybilGambleyyu/pdf-change-benchmark"
Repository = "https://github.com/SybilGambleyyu/pdf-change-benchmark"
Issues = "https://github.com/SybilGambleyyu/pdf-change-benchmark/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/pdfcab"]
include = ["src/pdfcab/fixtures/**"]

[tool.hatch.build.targets.sdist]
include = [
  "src/pdfcab",
  "tests",
  "docs",
  ".github",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]
